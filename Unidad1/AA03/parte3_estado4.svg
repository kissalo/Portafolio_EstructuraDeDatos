<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1063" height="552" viewBox="30 114 1063 552"><defs><marker id="m-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="m-dead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="m-act" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67e00"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker></defs><rect x="36" y="120" width="240" height="540" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.2"/><text x="48" y="140" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">CALL STACK  (tope arriba)</text><rect x="292" y="120" width="795" height="540" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.2"/><text x="304" y="140" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">HEAP (V8) y memoria externa   ·   objetos y funciones, unidos por referencias</text><rect x="50" y="156" width="212" height="78" rx="6" fill="#e8f0fe" stroke="#e67e00" stroke-width="3"/><text x="60" y="172.5" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="start">simularTrafico()</text><line x1="50" y1="180" x2="262" y2="180" stroke="#e67e00" stroke-width="0.8"/><text x="60" y="196" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start">i = 0  (fin de iteración)</text><text x="60" y="220" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start">usuario  (fuera de alcance)</text><rect x="50" y="244" width="212" height="24" rx="6" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/><text x="60" y="260.5" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="start">(módulo principal)</text><text x="48" y="412" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">ÁMBITO DEL MÓDULO  (raíz del GC)</text><rect x="50" y="420" width="212" height="102" rx="6" fill="#eceff3" stroke="#64748b" stroke-width="1.6"/><text x="60" y="436.5" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="start">(variables del módulo)</text><line x1="50" y1="444" x2="262" y2="444" stroke="#64748b" stroke-width="0.8"/><text x="60" y="460" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start">emisorGlobal</text><circle cx="250" cy="456" r="4.5" fill="#334155"/><text x="60" y="484" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start">GestorSesionUsuario  class</text><text x="60" y="508" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start">simularTrafico  ƒ</text><text x="50" y="250" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="1" font-weight="400" fill="#1f2937" text-anchor="start"></text><rect x="332" y="160" width="282" height="126" rx="8" fill="#f4f4f5" stroke="#9ca3af" stroke-width="1.7" stroke-dasharray="6 4"/><text x="344" y="179" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start">GestorSesionUsuario #0</text><line x1="332" y1="188" x2="614" y2="188" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="6 4"/><text x="344" y="207.0" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">idUsuario</text><circle cx="602" cy="203.0" r="4.5" fill="#6b7280"/><text x="344" y="237.0" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">bufferSesion</text><circle cx="602" cy="233.0" r="4.5" fill="#6b7280"/><text x="344" y="267.0" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">oyenteEvento</text><circle cx="602" cy="263.0" r="4.5" fill="#6b7280"/><rect x="684" y="188" width="112" height="24" rx="7" fill="#f4f4f5" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 3"/><text x="740.0" y="204.025" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">"USR_0"</text><rect x="684" y="222" width="176" height="44" rx="7" fill="#f4f4f5" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 3"/><text x="772.0" y="239.85" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle">Uint8Array</text><text x="772.0" y="255.85" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">byteLength 5 242 880</text><rect x="892" y="188" width="183" height="150" rx="10" fill="#fafafa" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><text x="903" y="206" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">Memoria externa (off-heap)</text><rect x="906" y="218" width="155" height="104" rx="7" fill="#fafafa" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 3"/><text x="983.5" y="249.85" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle">ArrayBuffer</text><text x="983.5" y="265.85" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">backing store</text><text x="983.5" y="281.85" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">5 MiB</text><text x="983.5" y="297.85" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">→ se libera</text><rect x="362" y="352" width="252" height="88" rx="7" fill="#f4f4f5" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 3"/><text x="488.0" y="383.525" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="700" fill="#6b7280" text-anchor="middle">ƒ oyenteEvento</text><text x="488.0" y="400.025" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">ya no está registrada</text><text x="488.0" y="416.525" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle">[[Contexto]] this → #0</text><path d="M 614 203.0 L 684 200" fill="none" stroke="#9ca3af" stroke-width="1.9" stroke-linejoin="round" stroke-dasharray="5 3" marker-end="url(#m-dead)"/><path d="M 614 233.0 L 684 240" fill="none" stroke="#9ca3af" stroke-width="1.9" stroke-linejoin="round" stroke-dasharray="5 3" marker-end="url(#m-dead)"/><path d="M 860 244 L 906 244" fill="none" stroke="#9ca3af" stroke-width="1.9" stroke-linejoin="round" stroke-dasharray="5 3" marker-end="url(#m-dead)"/><path d="M 614 263.0 L 648 263.0 L 648 400 L 614 400" fill="none" stroke="#9ca3af" stroke-width="1.9" stroke-linejoin="round" stroke-dasharray="5 3" marker-end="url(#m-dead)"/><path d="M 440 352 L 440 286" fill="none" stroke="#9ca3af" stroke-width="1.9" stroke-linejoin="round" stroke-dasharray="5 3" marker-end="url(#m-dead)"/><rect x="684" y="348" width="340" height="40" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/><text x="854" y="365" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2f855a" text-anchor="middle">INALCANZABLE desde las raíces</text><text x="854" y="381" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#2f855a" text-anchor="middle">→ el GC puede liberar ≈ 5 MiB</text><rect x="332" y="500" width="300" height="120" rx="8" fill="#fff4e0" stroke="#d9912b" stroke-width="1.7"/><text x="344" y="519" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#1f2937" text-anchor="start">emisorGlobal : EventEmitter</text><line x1="332" y1="528" x2="632" y2="528" stroke="#d9912b" stroke-width="0.8"/><text x="344" y="546.0" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start">_events: { }</text><text x="344" y="574.0" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start">_eventsCount: 0</text><text x="344" y="602.0" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#1f2937" text-anchor="start">_maxListeners: undefined</text><path d="M 262 456 L 332 548" fill="none" stroke="#334155" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#m-ref)"/><text x="486" y="478" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#2f855a" text-anchor="start">sin referencia hacia ƒ</text><rect x="666" y="408" width="409" height="234" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/><text x="680" y="428" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="start">Corrección propuesta</text><text x="680" y="452" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="9.5" font-weight="400" fill="#1f2937" text-anchor="start">cerrarSesion() {</text><text x="680" y="472" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="9.5" font-weight="400" fill="#1f2937" text-anchor="start">  console.log(`Cerrando sesión de ${this.idUsuario}`);</text><text x="680" y="492" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="9.5" font-weight="700" fill="#2f855a" text-anchor="start">  emisorGlobal.off('pingSistema', this.oyenteEvento);</text><text x="680" y="512" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="9.5" font-weight="400" fill="#1f2937" text-anchor="start">  this.bufferSesion = null;   // opcional</text><text x="680" y="532" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="9.5" font-weight="400" fill="#1f2937" text-anchor="start">}</text><text x="680" y="574" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="start">Resultado:</text><text x="680" y="593" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">Cada sesión se elimina de _events al cerrarse,</text><text x="680" y="609" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">listeners registrados = 0 y la memoria se recicla.</text><text x="680" y="630" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">Alternativa: emisorGlobal.once(...) si el aviso es único.</text></svg>